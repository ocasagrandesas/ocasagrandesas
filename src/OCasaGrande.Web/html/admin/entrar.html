<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administração — O Casa Grande</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/admin-login.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="container navbar__inner">
      <a class="brand" href="/">
        <svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#logo"></use></svg>
        O Casa Grande
      </a>
    </div>
  </header>

  <main class="container admin-auth">
    <div class="card">
      <h1>
        <svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#lock"></use></svg>
        Administração
      </h1>
      <p>Acesso restrito ao administrador da plataforma.</p>
      <form id="login-form" novalidate>
        <div id="login-error" class="alert" role="alert"></div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
        </div>
        <button class="button button--primary" type="submit">Entrar</button>
      </form>
    </div>
  </main>
</body>
</html>
